<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khoa Dược</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    
    <style>
        :root { --primary-color: #0f9d58; --bg-color: #f0f2f5; }
        body { background-color: var(--bg-color); font-family: 'Segoe UI', sans-serif; font-size: 15px; }
        
        /* Tabs & Card */
        .nav-pills .nav-link.active { background-color: var(--primary-color); color: white; box-shadow: 0 4px 6px rgba(15, 157, 88, 0.3); }
        .nav-pills .nav-link { color: #555; font-weight: 600; padding: 10px 20px; }
        .card-custom { border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-radius: 12px; background: white; }
        
        /* Lịch */
        #calendar-container { padding: 20px; background: white; border-radius: 12px; }
        .fc-toolbar-title { font-size: 1.8rem !important; color: #2c3e50; font-weight: 800; }
        .fc-day-today { background-color: #e6fffa !important; }
        .fc-event { cursor: pointer; border: none; padding: 2px 4px; font-size: 0.9em; }

        /* Badge & Slider */
        .badge-status { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; }
        .bg-todo { background-color: #dc3545; color: white; } 
        .bg-doing { background-color: #ffc107; color: #333; } 
        .bg-done { background-color: #198754; color: white; } 
        .range-slider { width: 100%; cursor: pointer; height: 8px; accent-color: var(--primary-color); }
        .btn-zalo { background-color: #0068ff; color: white; border: none; font-weight: 500; font-size: 0.85rem; padding: 4px 10px; border-radius: 4px; }
        
        /* CSS CHO DROPDOWN CHECKBOX */
        .dropdown-menu-custom {
            max-height: 350px;
            overflow-y: auto;
            width: 100%;
            padding: 0;
        }
        .group-header {
            background-color: #f8f9fa;
            padding: 8px 15px;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid #eee;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
        }
        .form-check {
            padding: 8px 15px 8px 40px;
            margin: 0;
            cursor: pointer;
            border-bottom: 1px solid #f8f9fa;
        }
        .form-check:hover { background-color: #f1f3f5; }
        .form-check-input { cursor: pointer; transform: scale(1.2); margin-left: -25px; }
        .form-check-label { cursor: pointer; width: 100%; display: inline-block; font-size: 0.95rem;}
        
        /* Ẩn thẻ select gốc */
        #hiddenAssigneeSelect { display: none; }
    </style>
</head>
<body>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-center align-items-center mb-4">
        <h2 class="text-success fw-bold m-0">🏥 QUẢN LÝ CÔNG VIỆC KHOA DƯỢC</h2>
    </div>

    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded shadow-sm" id="pills-tab" role="tablist" style="max-width: 900px; margin: 0 auto;">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-input">📝 Giao Việc</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-list" onclick="loadTaskList()">📋 Danh Sách</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-report" onclick="loadDashboard()">📊 Báo Cáo & Lịch</button></li>
    </ul>

    <div class="tab-content">
        
        <div class="tab-pane fade show active" id="pills-input">
            <div class="container" style="max-width: 800px;">
                <div class="card card-custom p-4">
                    <form id="taskForm">
                        <div class="mb-3"><label class="fw-bold fs-5">Tên công việc</label><input type="text" class="form-control form-control-lg" name="taskName" required placeholder="Nhập tên đầu việc..."></div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold fs-5 mb-2">Người thực hiện</label>
                                
                                <select name="assignee" id="hiddenAssigneeSelect" multiple>
                                    </select>

                                <div class="dropdown">
                                    <button class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between align-items-center py-2" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                                        <span id="selectedText">-- Chọn nhân sự --</span>
                                        <span class="badge bg-success rounded-pill" id="selectedCount">0</span>
                                    </button>
                                    
                                    <div class="dropdown-menu dropdown-menu-custom shadow" aria-labelledby="dropdownMenuButton">
                                        
                                        <div class="group-header">⭐ Lãnh đạo Khoa</div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Nguyễn Thị Hương Giang"><label class="form-check-label">DS.CKI Nguyễn Thị Hương Giang - Trưởng khoa</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Trần Thị Huyền Trang"><label class="form-check-label">DSĐH Trần Thị Huyền Trang - Phó khoa</label></div>

                                        <div class="group-header">💊 Nhân viên khoa</div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Chu Đài Trang"><label class="form-check-label">DS.CKI Chu Đài Trang</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Phạm Bá Thương"><label class="form-check-label">DSĐH Phạm Bá Thương</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Lê Thị Thanh Nhàn"><label class="form-check-label">DSĐH Lê Thị Thanh Nhàn</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Nguyễn Duy Tiến"><label class="form-check-label">DSĐH Nguyễn Duy Tiến (Tổ trưởng)</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Nguyễn Thị Hằng"><label class="form-check-label">DSĐH Nguyễn Thị Hằng</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Kiều Mạnh Toàn"><label class="form-check-label">DSĐH Kiều Mạnh Toàn</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Đỗ Thị Nhật Lệ"><label class="form-check-label">DSĐH Đỗ Thị Nhật Lệ</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Nguyễn Thị Thu Hà"><label class="form-check-label">DSĐH Nguyễn Thị Thu Hà</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Hà Thị Thảo"><label class="form-check-label">DS Hà Thị Thảo</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Nguyễn Tuấn Thành"><label class="form-check-label">DS Nguyễn Tuấn Thành</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Vũ Thị Hồng Hạnh"><label class="form-check-label">DSĐH Vũ Thị Hồng Hạnh</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Hà Thu Trang"><label class="form-check-label">DSĐH Hà Thu Trang</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Đoàn Thị Mai Hương"><label class="form-check-label">DSĐH Đoàn Thị Mai Hương</label></div>
                                        <div class="form-check"><input class="form-check-input" type="checkbox" value="Triệu Thị Vỵ"><label class="form-check-label">DSĐH Triệu Thị Vỵ</label></div>

                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold fs-5 mb-2">Trạng thái & Ưu tiên</label>
                                <select class="form-select mb-3" name="status">
                                    <option value="Todo" selected>Todo (Chờ)</option>
                                    <option value="Doing">Doing (Đang làm)</option>
                                </select>
                                <select class="form-select" name="priority">
                                    <option value="P1">🔴 Cao</option>
                                    <option value="P2" selected>🟡 Trung bình</option>
                                    <option value="P3">🟢 Thấp</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3"><label class="fw-bold fs-5">Deadline</label><input type="date" class="form-control" name="deadline"></div>
                        <div class="mb-4"><label class="fw-bold fs-5">Ghi chú</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-3 fs-5" id="submitBtn">LƯU CÔNG VIỆC</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-list">
            <div class="card card-custom p-4">
                <div class="row g-3 mb-4 bg-light p-3 rounded mx-0 border">
                    <div class="col-md-4"><select id="filterAssignee" class="form-select" onchange="renderTable()"><option value="">-- Tất cả nhân viên --</option></select></div>
                    <div class="col-md-3"><select id="filterStatus" class="form-select" onchange="renderTable()"><option value="">-- Tất cả TT --</option><option value="Todo">Todo</option><option value="Doing">Doing</option><option value="Done">Done</option></select></div>
                    <div class="col-md-3"><input type="text" id="filterText" class="form-control" placeholder="Tìm tên việc..." onkeyup="renderTable()"></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100 fw-bold" onclick="loadTaskList()">🔄 Tải lại</button></div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle border" style="font-size: 1rem;">
                        <thead class="table-success">
                            <tr>
                                <th width="25%">Công việc</th>
                                <th width="20%">Tiến độ</th>
                                <th width="15%">Người làm</th>
                                <th width="10%">Ngày tạo</th>
                                <th width="10%">Deadline</th>
                                <th width="10%">Trạng thái</th>
                                <th width="10%">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody">
                            <tr><td colspan="7" class="text-center py-5">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-report">
            <div class="row g-4 mb-5">
                <div class="col-md-6"><div class="card card-custom p-3 h-100"><div id="piechart" style="height:350px;"></div></div></div>
                <div class="col-md-6"><div class="card card-custom p-3 h-100"><div id="barchart_count" style="height:350px;"></div></div></div>
            </div>
            <div id="calendar-container"><div id="calendar"></div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- CẤU HÌNH ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_9NKQHyVrnuNHs4hzRElnEpLILt6bubcMZkle6CUvo9NmV0VtXeulm_g7HzJnC7MqyQ/exec"; 
    
    let globalData = [];

    // --- LOGIC CHECKBOX DROPDOWN ---
    const checkboxes = document.querySelectorAll('.dropdown-menu-custom .form-check-input');
    const hiddenSelect = document.getElementById('hiddenAssigneeSelect');
    const selectedText = document.getElementById('selectedText');
    const selectedCount = document.getElementById('selectedCount');

    // Khởi tạo select ẩn
    checkboxes.forEach((cb, index) => {
        // Tạo option ẩn
        const option = document.createElement('option');
        option.value = cb.value;
        option.text = cb.value;
        hiddenSelect.add(option);
        
        // Gán sự kiện
        cb.addEventListener('change', () => {
            hiddenSelect.options[index].selected = cb.checked;
            updateDisplay();
        });
    });

    function updateDisplay() {
        let count = 0;
        let names = [];
        checkboxes.forEach(cb => {
            if(cb.checked) {
                count++;
                names.push(cb.value); // Lấy tên ngắn gọn để hiển thị
            }
        });
        
        selectedCount.innerText = count;
        if(count === 0) selectedText.innerText = "-- Chọn nhân sự --";
        else if(count === 1) selectedText.innerText = names[0];
        else if(count === 2) selectedText.innerText = names.join(", ");
        else selectedText.innerText = `Đã chọn ${count} người`;
    }

    // 1. GỬI FORM
    document.getElementById('taskForm').addEventListener('submit', e => {
        e.preventDefault();
        
        if(selectedCount.innerText == "0") {
            alert("⚠️ Vui lòng chọn ít nhất một người thực hiện!");
            return;
        }

        const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "Đang lưu...";
        
        // Lấy danh sách tên từ hidden select
        const selectedValues = Array.from(hiddenSelect.selectedOptions).map(option => option.value);
        const assigneeString = selectedValues.join(', ');

        const formData = new FormData(document.getElementById('taskForm'));
        const data = Object.fromEntries(formData.entries());
        data.assignee = assigneeString; 

        fetch(SCRIPT_URL + "?action=add", { method: 'POST', body: JSON.stringify(data) })
        .then(r => r.json()).then(res => {
            if(res.status === 'success') {
                alert("✅ Đã giao việc cho: " + assigneeString);
                document.getElementById('taskForm').reset();
                checkboxes.forEach(cb => cb.checked = false); // Reset checkbox
                updateDisplay();
                document.querySelector('[data-bs-target="#pills-list"]').click();
            } else { alert("Lỗi: " + res.message); }
        }).finally(() => { btn.disabled = false; btn.innerText = "LƯU CÔNG VIỆC"; });
    });

    // 2. TẢI DỮ LIỆU
    function loadTaskList() {
        if(SCRIPT_URL.includes("DÁN_LINK")) { alert("Chưa dán Link API!"); return; }
        const tbody = document.getElementById('taskTableBody');
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-success"></div><br>Đang tải dữ liệu...</td></tr>';
        fetch(SCRIPT_URL + "?action=read").then(r => r.json()).then(res => {
            globalData = res.data; populateAssigneeFilter(globalData); renderTable();
        });
    }

    function populateAssigneeFilter(data) {
        const select = document.getElementById('filterAssignee');
        const currentVal = select.value;
        let allPeople = [];
        data.forEach(row => {
            let assigneeStr = String(row[7] || "");
            let peopleInRow = assigneeStr.split(',').map(s => s.trim()).filter(n => n);
            allPeople.push(...peopleInRow);
        });
        const uniquePeople = [...new Set(allPeople)].sort();
        select.innerHTML = '<option value="">-- Tất cả nhân viên --</option>';
        uniquePeople.forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
        select.value = currentVal;
    }

    // 3. VẼ BẢNG
    function renderTable() {
        const tbody = document.getElementById('taskTableBody'); tbody.innerHTML = "";
        const fName = document.getElementById('filterAssignee').value.toLowerCase().trim();
        const fStatus = document.getElementById('filterStatus').value;
        const fText = document.getElementById('filterText').value.toLowerCase().trim();

        let filteredData = globalData.filter(row => {
            let assignee = String(row[7] || "").toLowerCase(); 
            let status = String(row[2] || "").trim();
            let taskName = String(row[1] || "").toLowerCase();
            
            let matchName = (fName === "" || assignee.includes(fName));
            let matchStatus = fStatus === "" || (status.toLowerCase() === fStatus.toLowerCase());
            let matchText = fText === "" || taskName.includes(fText);
            return matchName && matchStatus && matchText;
        });

        filteredData.sort((a,b) => (String(a[2]).trim() === 'Done') - (String(b[2]).trim() === 'Done'));

        filteredData.forEach(row => {
            let id = row[0]; let name = row[1]; let rawStatus = String(row[2] || "").trim();
            let deadline = row[4] ? new Date(row[4]).toLocaleDateString('vi-VN') : '';
            let createdDate = row[6] ? new Date(row[6]).toLocaleDateString('vi-VN') : '';
            let assignee = row[7]; let progress = parseInt(String(row[8] || "0").replace('%','')) || 0;
            let badgeClass = rawStatus === 'Done' ? 'bg-done' : (rawStatus === 'Doing' ? 'bg-doing' : 'bg-todo');

            let doneBtn = rawStatus !== 'Done' ? `<button class="btn btn-outline-success btn-sm w-100" onclick="markAsDone('${id}')">✅ Xong</button>` : `<span class="text-success fw-bold">✓</span>`;
            
            let sliderHTML = rawStatus === 'Done' ? 
                `<div class="progress" style="height: 24px;"><div class="progress-bar bg-success" style="width: 100%">100%</div></div>` : 
                `<div class="d-flex align-items-center"><input type="range" class="range-slider me-2" min="0" max="100" step="10" value="${progress}" onchange="updateProgress('${id}', this.value)"><span class="badge bg-secondary" id="val-${id}" style="min-width: 45px;">${progress}%</span></div>`;

            let zaloBtn = rawStatus !== 'Done' ? `<button class="btn btn-zalo btn-sm w-100" onclick="sendZalo('${name}', '${assignee}', '${deadline}')">💬 Zalo</button>` : ``;

            tbody.innerHTML += `<tr>
                <td><div class="fw-bold text-primary text-break">${name}</div><small class="text-muted fst-italic">${row[5] || ''}</small></td>
                <td>${sliderHTML}</td>
                <td><span class="fw-bold">${assignee}</span></td>
                <td><small>${createdDate}</small></td>
                <td>${deadline}</td>
                <td><span class="badge badge-status ${badgeClass}">${rawStatus}</span></td>
                <td><div class="d-flex flex-column gap-2">${doneBtn}${zaloBtn}</div></td>
            </tr>`;
        });
    }

    function updateProgress(id, value) {
        document.getElementById(`val-${id}`).innerText = value + "%";
        fetch(SCRIPT_URL + "?action=update_progress", { method: 'POST', body: JSON.stringify({ id: id, progress: value }) })
        .then(r => r.json()).then(res => { if(value == 100) loadTaskList(); });
    }
    function markAsDone(taskId) {
        if (!confirm("Xác nhận hoàn thành?")) return;
        fetch(SCRIPT_URL + "?action=update", { method: 'POST', body: JSON.stringify({ id: taskId }) })
        .then(r => r.json()).then(res => { alert(res.message); loadTaskList(); });
    }
    function sendZalo(taskName, personName, deadline) {
        const text = `⚠️ NHẮC VIỆC KHOA DƯỢC\n\nKính gửi: ${personName}\nCông việc: "${taskName}"\nHạn: ${deadline}\n\nĐề nghị cập nhật tiến độ.`;
        navigator.clipboard.writeText(text).then(() => { if(confirm("Đã COPY nội dung! Mở Zalo dán ngay?")) window.open('https://chat.zalo.me/', '_blank'); });
    }

    // 4. BÁO CÁO & LỊCH
    google.charts.load('current', {'packages':['corechart', 'bar']});
    function loadDashboard() {
        if(SCRIPT_URL.includes("DÁN_LINK")) return;
        fetch(SCRIPT_URL + "?action=read").then(r => r.json()).then(res => {
            drawCharts(res.data);
            renderCalendar(res.data);
        });
    }

    function drawCharts(data) {
        if(!data || data.length === 0) return;
        var statusCount = {'Todo': 0, 'Doing': 0, 'Done': 0};
        var personStats = {}; 
        
        data.forEach(row => {
            let status = String(row[2] || "").trim();
            let assigneeStr = String(row[7] || "");
            if(statusCount[status] !== undefined) statusCount[status]++; else statusCount['Doing'] = (statusCount['Doing'] || 0) + 1;
            
            let peopleInRow = assigneeStr.split(',').map(s => s.trim()).filter(n => n);
            peopleInRow.forEach(person => {
                if(!personStats[person]) personStats[person] = { count: 0 };
                personStats[person].count++;
            });
        });

        new google.visualization.PieChart(document.getElementById('piechart')).draw(google.visualization.arrayToDataTable([['S','C'],['Todo',statusCount['Todo']],['Doing',statusCount['Doing']],['Done',statusCount['Done']]]),{colors:['#dc3545','#ffc107','#198754'],is3D:true,legend:{position:'bottom'}, title: 'Tỉ lệ hoàn thành', titleTextStyle:{fontSize: 16}});
        var cA = [['NV','Số việc',{role:'style'}]]; Object.keys(personStats).sort().forEach(p=>cA.push([p,personStats[p].count,'#0d6efd']));
        new google.visualization.ColumnChart(document.getElementById('barchart_count')).draw(google.visualization.arrayToDataTable(cA),{legend:{position:"none"}, title: 'Số lượng việc (Tính cả làm chung)', titleTextStyle:{fontSize: 16}});
    }

    function renderCalendar(data) {
        var calendarEl = document.getElementById('calendar');
        var events = data.map(row => {
            let name = row[1]; let status = String(row[2] || "").trim(); let deadline = row[4]; let assignee = row[7];
            let color = '#3788d8'; if(status==='Done') color='#198754'; else if(status==='Todo') color='#dc3545'; else if(status==='Doing') color='#ffc107';
            if(deadline) { let d=new Date(deadline).toISOString().split('T')[0]; return { title: `${name} (${assignee})`, start: d, color: color, textColor: status==='Doing'?'#333':'white' }; } return null;
        }).filter(e=>e!==null);
        
        if(window.myCalendar) { 
            window.myCalendar.removeAllEvents(); 
            window.myCalendar.addEventSource(events); 
        } else {
            window.myCalendar = new FullCalendar.Calendar(calendarEl, { 
                initialView: 'dayGridMonth', 
                locale: 'vi', 
                height: '85vh', 
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listMonth' }, 
                buttonText: { today: 'Hôm nay', month: 'Tháng', list: 'Danh sách' },
                events: events, 
                eventClick: function(i){ alert('📌 ' + i.event.title + '\n📅 Hạn: ' + i.event.start.toLocaleDateString('vi-VN')); } 
            });
            window.myCalendar.render(); 
            setTimeout(()=>{window.myCalendar.updateSize()},200);
        }
    }
</script>
</body>
</html>
