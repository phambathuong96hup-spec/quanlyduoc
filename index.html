<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khoa Dược</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    
    <style>
        :root { --primary-color: #0f9d58; --bg-color: #f0f2f5; }
        body { background-color: var(--bg-color); font-family: 'Segoe UI', sans-serif; font-size: 14px; }
        
        .nav-pills .nav-link.active { background-color: var(--primary-color); color: white; box-shadow: 0 4px 6px rgba(15, 157, 88, 0.3); }
        .nav-pills .nav-link { color: #555; font-weight: 600; font-size: 0.95rem; cursor: pointer;}
        .card-custom { border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-radius: 12px; background: white; }
        #calendar-container { padding: 20px; background: white; border-radius: 12px; }
        
        /* Calendar Styles */
        .fc-toolbar-title { font-size: 1.5rem !important; color: #2c3e50; font-weight: 800; }
        .fc-event { cursor: pointer; border: none; padding: 2px 4px; font-size: 0.9em; border-radius: 4px; }
        .fc-day-today { background-color: #e6fffa !important; }
        
        .badge-status { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; }
        .bg-todo { background-color: #dc3545; color: white; } .bg-doing { background-color: #ffc107; color: #333; } .bg-done { background-color: #198754; color: white; }
        .range-slider { width: 100%; cursor: pointer; height: 8px; accent-color: var(--primary-color); }
        
        .btn-action { font-size: 0.8rem; font-weight: 500; padding: 4px 8px; width: 100%; text-align: left; margin-bottom: 4px; border-radius: 4px; border: none; transition: 0.2s; }
        .btn-email { background-color: #fff3cd; color: #856404; } .btn-email:hover { background-color: #ffeeba; }
        .btn-done { background-color: #d1e7dd; color: #0f5132; } .btn-done:hover { background-color: #badbcc; }

        /* Dropdown & Checkbox */
        .dropdown-menu-custom { max-height: 300px; overflow-y: auto; width: 100%; padding: 0; }
        .group-header { background-color: #f8f9fa; padding: 8px 15px; font-weight: bold; color: var(--primary-color); font-size: 0.9rem; }
        .form-check { padding: 8px 15px 8px 40px; margin: 0; cursor: pointer; border-bottom: 1px solid #f8f9fa; }
        .form-check:hover { background-color: #f1f3f5; }
        .form-check-input { cursor: pointer; transform: scale(1.2); margin-left: -25px; }
        
        #hiddenAssigneeSelect { display: none; }
        .deadline-extended { color: #dc3545; font-weight: bold; }
        .deadline-original { text-decoration: line-through; color: #999; font-size: 0.85em; display: block; }
        .admin-only { display: none !important; }
    </style>
</head>
<body>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-success fw-bold m-0">🏥 QUẢN LÝ KHOA DƯỢC</h3>
        <div>
            <button class="btn btn-outline-dark btn-sm" id="btnLogin" onclick="showLoginModal()">🔑 Admin</button>
            <button class="btn btn-outline-danger btn-sm d-none" id="btnLogout" onclick="logout()">🚪 Thoát</button>
        </div>
    </div>

    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded shadow-sm" id="pills-tab" role="tablist">
        <li class="nav-item admin-only"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-input">📝 Giao Việc</button></li>
        <li class="nav-item admin-only"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-compliance">⚖️ Nội Quy</button></li>
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-list" onclick="loadTaskList()">📋 Danh Sách</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-report" onclick="loadDashboard()">📊 Báo Cáo & Lịch</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade" id="pills-input">
            <div class="container" style="max-width: 900px;">
                <div class="card card-custom p-4">
                    <form id="taskForm">
                        <div class="mb-3"><label class="fw-bold">Tên công việc</label><input type="text" class="form-control" name="taskName" required></div>
                        <div class="mb-3">
                            <label class="fw-bold">Người thực hiện</label>
                            <select name="assignee" id="hiddenAssigneeSelect" multiple></select>
                            <div class="dropdown">
                                <button class="btn btn-outline-secondary w-100 text-start d-flex justify-content-between" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                                    <span id="selectedText">-- Chọn nhân sự --</span><span class="badge bg-success rounded-pill" id="selectedCount">0</span>
                                </button>
                                <div class="dropdown-menu dropdown-menu-custom shadow" id="checkboxContainer"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="fw-bold">Trạng thái</label><select class="form-select" name="status"><option value="Todo">Todo</option><option value="Doing">Doing</option></select></div>
                            <div class="col-md-4 mb-3"><label class="fw-bold">Ưu tiên</label><select class="form-select" name="priority"><option value="P1">🔴 Cao</option><option value="P2" selected>🟡 TB</option><option value="P3">🟢 Thấp</option></select></div>
                            <div class="col-md-4 mb-3"><label class="fw-bold">Độ khó</label><select class="form-select" name="difficulty"><option value="Dễ">🟢 Dễ</option><option value="Bình thường" selected>🔵 BT</option><option value="Khó">🟠 Khó</option><option value="Rất khó">🔴 Rất khó</option></select></div>
                        </div>
                        <div class="mb-3"><label class="fw-bold">Deadline</label><input type="date" class="form-control" name="deadline"></div>
                        <div class="mb-3"><textarea class="form-control" name="notes" rows="2" placeholder="Ghi chú..."></textarea></div>
                        <button type="submit" class="btn btn-success w-100 fw-bold" id="submitBtn">LƯU CÔNG VIỆC</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="tab-pane fade show active" id="pills-list">
            <div class="card card-custom p-4">
                <div class="row g-2 mb-3">
                    <div class="col-md-3"><select id="filterAssignee" class="form-select form-select-sm" onchange="renderTable()"><option value="">NV: Tất cả</option></select></div>
                    <div class="col-md-3"><select id="filterStatus" class="form-select form-select-sm" onchange="renderTable()"><option value="">TT: Tất cả</option><option value="Todo">Todo</option><option value="Doing">Doing</option><option value="Done">Done</option></select></div>
                    <div class="col-md-4"><input type="text" id="filterText" class="form-control form-control-sm" placeholder="Tìm..." onkeyup="renderTable()"></div>
                    <div class="col-md-2"><button class="btn btn-primary btn-sm w-100" onclick="loadTaskList()">🔄 Tải</button></div>
                </div>
                <div class="table-responsive"><table class="table table-hover align-middle border"><tbody id="taskTableBody"></tbody></table></div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-compliance">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card card-custom p-3 h-100">
                        <h5 class="text-danger fw-bold text-center">⚖️ Ghi nhận Vi phạm/Khen</h5>
                        <form id="complianceForm">
                            <div class="mb-2"><label class="fw-bold small">Nhân viên</label><select class="form-select" name="person" id="compliancePerson" required></select></div>
                            <div class="mb-2"><label class="fw-bold small">Loại</label><select class="form-select" name="type" required><option value="Vi phạm">⚠️ Vi phạm</option><option value="Khen thưởng">🏆 Khen thưởng</option></select></div>
                            <div class="mb-2"><label class="fw-bold small">Nội dung</label><textarea class="form-control" name="fault" rows="3" required></textarea></div>
                            <div class="mb-3"><label class="fw-bold small">Ghi chú</label><input type="text" class="form-control" name="note"></div>
                            <button type="submit" class="btn btn-danger w-100" id="btnCompliance">Lưu ghi nhận</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card card-custom p-3 h-100">
                        <div class="d-flex justify-content-between mb-3"><h5 class="fw-bold text-secondary">📜 Lịch sử</h5><button class="btn btn-sm btn-outline-secondary" onclick="loadCompliance()">🔄 Tải lại</button></div>
                        <div class="table-responsive"><table class="table table-sm table-striped"><thead class="table-light"><tr><th>Ngày</th><th>Nhân viên</th><th>Loại</th><th>Nội dung</th><th>Ghi chú</th></tr></thead><tbody id="complianceBody"></tbody></table></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-report">
            <div class="row g-4 mb-4">
                <div class="col-md-4"><div class="card card-custom p-3 h-100"><h6 class="text-center fw-bold text-secondary">Tỉ lệ hoàn thành (Việc)</h6><div id="piechart_task" style="height:250px;"></div></div></div>
                <div class="col-md-4"><div class="card card-custom p-3 h-100"><h6 class="text-center fw-bold text-secondary">Khối lượng công việc</h6><div id="barchart_task" style="height:250px;"></div></div></div>
                <div class="col-md-4"><div class="card card-custom p-3 h-100"><h6 class="text-center fw-bold text-secondary">Tình hình Nội quy</h6><div id="columnchart_compliance" style="height:250px;"></div></div></div>
            </div>
            
            <div class="card card-custom p-4">
                <h5 class="text-success fw-bold mb-3">📅 LỊCH TỔNG HỢP (CÔNG VIỆC + NỘI QUY)</h5>
                <div id="calendar"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1"><div class="modal-dialog modal-sm"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">🔐 Admin Login</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="password" id="adminPassword" class="form-control" placeholder="Mật khẩu..."></div><div class="modal-footer"><button type="button" class="btn btn-primary w-100" onclick="performLogin()">Đăng nhập</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_9NKQHyVrnuNHs4hzRElnEpLILt6bubcMZkle6CUvo9NmV0VtXeulm_g7HzJnC7MqyQ/exec"; 
    let globalData = [];
    let currentPass = "";

    const STAFF_GROUPS = {
        "⭐ Lãnh đạo Khoa": ["Nguyễn Thị Hương Giang", "Trần Thị Huyền Trang"],
        "💊 Nhân viên khoa": ["Chu Đài Trang", "Phạm Bá Thương", "Lê Thị Thanh Nhàn", "Nguyễn Duy Tiến", "Nguyễn Thị Hằng", "Kiều Mạnh Toàn", "Đỗ Thị Nhật Lệ", "Nguyễn Thị Thu Hà", "Hà Thị Thảo", "Nguyễn Tuấn Thành", "Vũ Thị Hồng Hạnh", "Hà Thu Trang", "Đoàn Thị Mai Hương", "Triệu Thị Vỵ"]
    };

    initCheckboxes(); initSingleSelect('compliancePerson');
    loadTaskList(); checkLoginState();

    // --- LOGIN ---
    function showLoginModal() { new bootstrap.Modal(document.getElementById('loginModal')).show(); }
    function performLogin() { const p = document.getElementById('adminPassword').value; if(p){ currentPass=p; sessionStorage.setItem('admin_pass',p); applyLoginState(true); bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide(); alert("🔓 OK!"); } }
    function logout() { sessionStorage.removeItem('admin_pass'); currentPass=""; applyLoginState(false); location.reload(); }
    function checkLoginState() { const s=sessionStorage.getItem('admin_pass'); if(s){ currentPass=s; applyLoginState(true); } else applyLoginState(false); }
    function applyLoginState(isLogged) { document.querySelectorAll('.admin-only').forEach(el=>el.style.setProperty("display",isLogged?"block":"none","important")); document.getElementById('btnLogin').classList.toggle('d-none',isLogged); document.getElementById('btnLogout').classList.toggle('d-none',!isLogged); }

    // --- INIT UI ---
    function initCheckboxes() {
        const c=document.getElementById('checkboxContainer'), h=document.getElementById('hiddenAssigneeSelect'), t=document.getElementById('selectedText'), n=document.getElementById('selectedCount');
        c.innerHTML=""; let i=0;
        for(const[g,ppl] of Object.entries(STAFF_GROUPS)){
            c.innerHTML+=`<div class="group-header">${g}</div>`;
            ppl.forEach(name=>{
                h.add(new Option(name,name));
                const d=document.createElement('div'); d.className='form-check';
                d.innerHTML=`<input class="form-check-input" type="checkbox" value="${name}" id="chk${i}"><label class="form-check-label" for="chk${i}">${name}</label>`;
                c.appendChild(d);
                d.querySelector('input').addEventListener('change',(e)=>{h.options[i].selected=e.target.checked; updateDisplay(h,t,n);});
                i++;
            });
        }
    }
    function initSingleSelect(elId) { const s=document.getElementById(elId); s.innerHTML='<option value="">-- Chọn --</option>'; for(const[g,ppl] of Object.entries(STAFF_GROUPS)){ const o=document.createElement('optgroup'); o.label=g; ppl.forEach(n=>o.innerHTML+=`<option value="${n}">${n}</option>`); s.appendChild(o); } }
    function updateDisplay(s,t,c) { let cnt=0,nms=[]; Array.from(s.options).forEach(o=>{if(o.selected){cnt++;nms.push(o.value)}}); c.innerText=cnt; t.innerText=cnt===0?"-- Chọn nhân sự --":(cnt<=2?nms.join(", "):`Đã chọn ${cnt} người`); }

    // --- FORMS ---
    document.getElementById('taskForm').addEventListener('submit', e => { e.preventDefault(); if(!currentPass){alert("⛔ Login!");return;} const btn=document.getElementById('submitBtn'); btn.disabled=true; const d=Object.fromEntries(new FormData(e.target).entries()); d.assignee=Array.from(document.getElementById('hiddenAssigneeSelect').selectedOptions).map(o=>o.value).join(', '); d.password=currentPass; fetch(SCRIPT_URL+"?action=add",{method:'POST',body:JSON.stringify(d)}).then(r=>r.json()).then(res=>{ alert(res.message); if(res.status==='success'){e.target.reset(); document.querySelectorAll('#checkboxContainer input').forEach(c=>c.checked=false); updateDisplay(document.getElementById('hiddenAssigneeSelect'),document.getElementById('selectedText'),document.getElementById('selectedCount')); document.querySelector('[data-bs-target="#pills-list"]').click();} }).finally(()=>{btn.disabled=false;}); });

    document.getElementById('complianceForm').addEventListener('submit', e => { e.preventDefault(); if(!currentPass){alert("⛔ Login!");return;} const btn=document.getElementById('btnCompliance'); btn.disabled=true; const d=Object.fromEntries(new FormData(e.target).entries()); d.password=currentPass; fetch(SCRIPT_URL+"?action=add_compliance",{method:'POST',body:JSON.stringify(d)}).then(r=>r.json()).then(res=>{ alert(res.message); if(res.status==='success'){e.target.reset(); loadCompliance();} }).finally(()=>{btn.disabled=false;}); });

    // --- DATA ---
    function loadCompliance() {
        const tb=document.getElementById('complianceBody'); tb.innerHTML='<tr><td colspan="5" class="text-center">Loading...</td></tr>';
        fetch(SCRIPT_URL+"?action=read_compliance").then(r=>r.json()).then(res=>{
            tb.innerHTML=""; if(!res.data||!res.data.length){tb.innerHTML='<tr><td colspan="5" class="text-center text-muted">Trống</td></tr>';return;}
            res.data.reverse().forEach(r=>{
                // row: ID, Date, Person, Type(Fault), Note
                // Backend cũ lưu: id, date, person, fault, note. Nhưng tôi thêm trường Type ở frontend.
                // Để tương thích code cũ: fault chính là Type hoặc Content.
                // Ở backend cũ: appendRow([id, new Date(), postData.person, postData.fault, postData.note]);
                // Nên r[3] là nội dung lỗi/khen.
                let isBonus = r[3].toLowerCase().includes("khen") || r[4].toLowerCase().includes("khen");
                let badge = isBonus ? '<span class="badge bg-warning text-dark">🏆 Khen</span>' : '<span class="badge bg-danger">⚠️ Vi phạm</span>';
                tb.innerHTML+=`<tr><td>${new Date(r[1]).toLocaleDateString('vi-VN')}</td><td class="fw-bold">${r[2]}</td><td>${badge}</td><td>${r[3]}</td><td>${r[4]||''}</td></tr>`;
            });
        });
    }

    function loadTaskList() { fetch(SCRIPT_URL).then(r=>r.json()).then(res=>{ globalData=res.data; populateFilter(); renderTable(); }); }
    function populateFilter() { const s=document.getElementById('filterAssignee'); let a=[]; globalData.forEach(r=>a.push(...String(r[7]).split(',').map(v=>v.trim()).filter(v=>v))); [...new Set(a)].sort().forEach(n=>s.innerHTML+=`<option value="${n}">${n}</option>`); }
    function renderTable() {
        const tb=document.getElementById('taskTableBody'); tb.innerHTML="";
        const fN=document.getElementById('filterAssignee').value.toLowerCase().trim();
        const fS=document.getElementById('filterStatus').value;
        const fT=document.getElementById('filterText').value.toLowerCase().trim();
        let flt=globalData.filter(r=>{
            let as=String(r[7]).toLowerCase(), st=String(r[2]).trim(), nm=String(r[1]).toLowerCase();
            return (fN===""||as.includes(fN)) && (fS===""||st.toLowerCase()===fS.toLowerCase()) && (fT===""||nm.includes(fT));
        });
        flt.sort((a,b)=>(String(a[2]).trim()==='Done')-(String(b[2]).trim()==='Done'));
        flt.forEach(r=>{
            let id=r[0], name=r[1], status=String(r[2]).trim(), created=new Date(r[6]).toLocaleDateString('vi-VN'), assignee=r[7], prog=parseInt(String(r[8]).replace('%',''))||0;
            let diff=r[10]||"", bdgDiff=diff?`<span class="badge bg-light text-dark border ms-1">${diff}</span>`:"";
            let dlRaw=r[9]||r[4], dlDisp="";
            if(r[9]) dlDisp=`<span class="deadline-original">${new Date(r[4]).toLocaleDateString('vi-VN')}</span><span class="deadline-extended">${new Date(r[9]).toLocaleDateString('vi-VN')}</span>`;
            else if(r[4]) dlDisp=new Date(r[4]).toLocaleDateString('vi-VN');
            
            let slider=status==='Done'?`<div class="progress" style="height:20px"><div class="progress-bar bg-success" style="width:100%">100%</div></div>`:
                `<div class="d-flex align-items-center"><input type="range" class="range-slider me-2" min="0" max="100" step="10" value="${prog}" onchange="updateProgress('${id}',this.value)"><span class="badge bg-secondary" id="val-${id}" style="min-width:35px">${prog}%</span></div>`;
            let cls=status==='Done'?'bg-done':(status==='Doing'?'bg-doing':'bg-todo');
            let btns=status!=='Done'?`<button class="btn btn-sm btn-outline-success mb-1 w-100" onclick="markDone('${id}')">✅ Xong</button><button class="btn btn-action btn-email" onclick="openEmail('${name}','${assignee}','${r[9]||r[4]}')">📧 Email</button>`:'';
            tb.innerHTML+=`<tr><td><span class="fw-bold text-primary">${name}</span>${bdgDiff}<br><small class="text-muted">${r[5]||''}</small></td><td>${slider}</td><td><small class="fw-bold">${assignee}</small></td><td>${created}</td><td>${dlDisp}</td><td><span class="badge badge-status ${cls}">${status}</span></td><td>${btns}</td></tr>`;
        });
    }
    
    function updateProgress(id,v){document.getElementById(`val-${id}`).innerText=v+'%'; fetch(SCRIPT_URL+"?action=update_progress",{method:'POST',body:JSON.stringify({id:id,progress:v})}).then(r=>r.json()).then(res=>{if(v==100)loadTaskList()});}
    function markDone(id){if(confirm('Xong?')) fetch(SCRIPT_URL+"?action=update",{method:'POST',body:JSON.stringify({id:id})}).then(r=>r.json()).then(res=>{alert(res.message);loadTaskList()});}
    function openEmail(t,p,d){ let dl=d?new Date(d).toLocaleDateString('vi-VN'):'Sớm nhất'; window.location.href=`mailto:?subject=${encodeURIComponent("⚠️ NHẮC: "+t)}&body=${encodeURIComponent("Chào "+p+",\n\nViệc: "+t+"\nHạn: "+dl+"\n\nVui lòng báo cáo.")}`; }

    // --- DASHBOARD: HỢP NHẤT ---
    google.charts.load('current',{'packages':['corechart','bar']});
    
    function loadDashboard() { 
        if(SCRIPT_URL.includes("DÁN_LINK")) return;
        // Gọi cả 2 API cùng lúc
        Promise.all([
            fetch(SCRIPT_URL).then(r=>r.json()), // Task Data
            fetch(SCRIPT_URL+"?action=read_compliance").then(r=>r.json()) // Compliance Data
        ]).then(([taskRes, compRes]) => {
            const tasks = taskRes.data || [];
            const compliance = compRes.data || [];
            
            drawCombinedCharts(tasks, compliance);
            renderCombinedCalendar(tasks, compliance);
        });
    }

    function drawCombinedCharts(tasks, compliance) {
        // Chart 1: Task Status
        var s={'Todo':0,'Doing':0,'Done':0}, pTask={};
        tasks.forEach(r=>{ s[String(r[2]).trim()]++; String(r[7]).split(',').forEach(n=>{ n=n.trim(); if(n){ if(!pTask[n])pTask[n]=0; pTask[n]++; } }); });
        new google.visualization.PieChart(document.getElementById('piechart_task')).draw(google.visualization.arrayToDataTable([['S','C'],['Todo',s.Todo],['Doing',s.Doing],['Done',s.Done]]),{colors:['#dc3545','#ffc107','#198754'],is3D:true,legend:'bottom',chartArea:{left:10,top:10,width:'90%',height:'80%'}});
        
        // Chart 2: Task Count
        var arrTask=[['NV','Việc',{role:'style'}]]; Object.keys(pTask).sort().forEach(k=>arrTask.push([k,pTask[k],'#0d6efd']));
        new google.visualization.ColumnChart(document.getElementById('barchart_task')).draw(google.visualization.arrayToDataTable(arrTask),{legend:'none',chartArea:{left:30,top:20,width:'85%',height:'70%'}});

        // Chart 3: Compliance (Mới)
        var pComp = {};
        compliance.forEach(r => {
            // r[2] = name, r[3] = type (hoặc r[4] tùy dữ liệu, ở đây giả định r[3] chứa loại lỗi/khen)
            // Nếu bạn nhập ở form trên là "Loại" (Type) thì backend lưu vào cột thứ 4 (Index 3).
            let name = r[2]; 
            let type = r[3] || ""; // Vi phạm / Khen thưởng
            if (!pComp[name]) pComp[name] = { fault: 0, bonus: 0 };
            
            if (type.includes("Khen")) pComp[name].bonus++;
            else pComp[name].fault++;
        });
        
        var arrComp = [['NV', 'Vi phạm', 'Khen thưởng']];
        Object.keys(pComp).sort().forEach(k => {
            if(pComp[k].fault > 0 || pComp[k].bonus > 0)
                arrComp.push([k, pComp[k].fault, pComp[k].bonus]);
        });
        
        if(arrComp.length > 1) {
            new google.visualization.ColumnChart(document.getElementById('columnchart_compliance')).draw(
                google.visualization.arrayToDataTable(arrComp), 
                { colors:['#dc3545','#ffc107'], isStacked: true, legend:'bottom', chartArea:{left:30,top:20,width:'85%',height:'70%'} }
            );
        } else {
            document.getElementById('columnchart_compliance').innerHTML = "<div class='text-center text-muted mt-5'>Chưa có dữ liệu</div>";
        }
    }

    function renderCombinedCalendar(tasks, compliance) {
        var calendarEl = document.getElementById('calendar');
        var events = [];

        // 1. Map Tasks
        tasks.forEach(r => {
            let name = r[1], status = String(r[2]).trim(), assignee = r[7];
            let date = r[9] || r[4]; // Ưu tiên ngày gia hạn
            if (!date) return;
            
            let color = '#0d6efd'; // Default Blue
            if(status==='Done') color='#198754'; // Green
            else if(status==='Todo') color='#dc3545'; // Red
            else if(status==='Doing') color='#ffc107'; // Yellow
            
            events.push({
                title: `${name} (${assignee})`,
                start: new Date(date).toISOString().split('T')[0],
                color: color,
                textColor: status==='Doing'?'black':'white',
                description: `Trạng thái: ${status}`
            });
        });

        // 2. Map Compliance
        compliance.forEach(r => {
            // r[1] = Date, r[2] = Name, r[3] = Type/Fault
            if(!r[1]) return;
            let type = r[3] || "";
            let isBonus = type.includes("Khen");
            
            events.push({
                title: isBonus ? `🏆 Khen: ${r[2]}` : `⚠️ Lỗi: ${r[2]}`,
                start: new Date(r[1]).toISOString().split('T')[0],
                color: isBonus ? '#fd7e14' : '#212529', // Orange vs Black
                textColor: 'white',
                description: `Nội dung: ${r[4] || type}`
            });
        });

        var cal = new FullCalendar.Calendar(calendarEl, { 
            initialView: 'dayGridMonth', 
            locale: 'vi', 
            height: '85vh', 
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listMonth' }, 
            buttonText: { today: 'Hôm nay', month: 'Tháng', list: 'Danh sách' },
            events: events, 
            eventClick: function(i){ alert('📌 ' + i.event.title + '\n📅 Ngày: ' + i.event.start.toLocaleDateString('vi-VN') + '\nℹ️ ' + i.event.extendedProps.description); } 
        });
        cal.render(); 
        setTimeout(()=>cal.updateSize(), 200);
    }
</script>
